- title: "As A.I. Majors Grow, Universities Race to Keep Curricula Relevant"
  source: Observer
  by_line: Eric Berger
  date: August 18, 2026
  url: https://observer.com/2026/08/university-ai-degree-adapting-advancing-technology/
  year: 2026
  summary: |
    Observer reports on the rapid growth of undergraduate A.I. degree programs—at least 70 U.S. colleges now offer A.I. majors and 90 offer minors, up from just five majors five years ago—and the challenge of teaching a field that changes as fast as it is being taught. Chris Callison-Burch notes that this is familiar territory for computer scientists: "In computer science, we are fairly used to technology that changes rapidly." He describes overhauling roughly 40 percent of his natural language processing course during the most recent academic year to accommodate "all the breakthroughs in the large language models that have happened." On the job market, he acknowledges student anxiety—"The worry among many undergraduates is that the entry-level jobs that they normally would have found at a big tech company like Google or Amazon can now be done by A.I. agents"—but remains optimistic about Penn graduates' prospects: "The amount of software being created is growing at such a huge rate that my strong belief is there is going to be strong demand for people who understand A.I. and people who understand computer science. But those jobs may be spread across a much wider range of employers than they were before." The article also features Carnegie Mellon's Reid Simmons on grounding the first U.S. undergraduate A.I. degree in mathematics and statistics.
- title: "Study examines AI chat bot bias, how it responds to prompts"
  source: ABC 6 Action News WPVI-TV Philadelphia
  by_line: Christie Ileto
  date: July 23, 2026
  url: https://6abc.com/post/study-examines-ai-chat-bot-bias-how-responds-prompts/19564010/
  year: 2026
  summary: |
    ABC 6 Action News reports on a study, highlighted by The Washington Post, examining whether AI chatbots provide factual answers or reflect political bias. Researchers evaluated ChatGPT, Gemini, and Claude using benchmarks and political prompts on topics like the death penalty and gun control, instructing the models to answer in 30 words without personalization settings. Gemini scored highest for presenting multiple viewpoints (93% of responses), Claude maintained neutrality 57% of the time, and ChatGPT was found to be left-leaning 80% of the time. Chris Callison-Burch demonstrated responses from Claude and ChatGPT using a prompt about affirmative action, noting both chatbots treated it as a contested policy question with multiple perspectives: "Here it's saying this is a contested policy question, so it's saying it has multiple perspectives, not just one." He explained that chatbots are trained on vast amounts of internet data and can reflect the behavior and preferences of their users. Despite concerns about bias, he said there is no need for alarm because people ultimately make their own decisions rather than relying on a chatbot to decide for them, while urging users to remain aware of AI's limitations.
- title: "Can AI Detectors Be Trusted?"
  source: Communications of the ACM
  by_line: Samuel Greengard
  date: June 23, 2026
  url: https://cacm.acm.org/news/can-ai-detectors-be-trusted/
  year: 2026
  summary: |
    Communications of the ACM examines the unreliability of AI text detectors, which have flagged works including Macbeth, the U.S. Constitution, and the Book of Genesis as machine-generated. Chris Callison-Burch, Raj and Nira Singh Professor of Artificial Intelligence at the University of Pennsylvania, explains a core flaw: because LLMs are trained on human prose, professional writers who adopt clean, measured styles get penalized—"Straightforward syntax, varied rhythm, strong transitions, and a measured tone get flagged as machine-generated." He recounts serving as an expert witness in a College of Charleston case where a student received a failing grade from a single detector score with "no conversation," and the student's father sued and prevailed. The article also features PhD student Liam Dugan, who co-developed the RAID (Robust AI Detection) benchmark of 10 million documents; testing 12 detectors found simple modifications pushed error rates above 95%. Callison-Burch argues detectors should never be the sole basis for sanctioning someone: "You catch lazy cheaters—and potentially innocent people. The smartest cheaters will beat your detector," and "If you adopt a no-AI policy and a detector flags text, the next step is to have a conversation with the person. Otherwise, you will accuse innocent people of cheating."
- title: "Living with AI: How artificial intelligence could impact the job market"
  source: ABC 6 Action News WPVI-TV Philadelphia
  by_line: Christie Ileto
  date: March 5, 2026
  url: https://6abc.com/post/living-ai-how-artificial-intelligence-could-impact-job-market/18680334/
  year: 2026
  summary: |
    ABC 6 Action News reports on AI's impact on the job market, featuring Chris Callison-Burch discussing which jobs are most exposed: "Interestingly, they're things like writers and coders and mathematicians, and people who do research and write survey articles." He offers a balanced perspective, noting "a real possibility that it could lead to widespread layoffs in many, many different industries" while also encouraging people to embrace the technology: "It's also a great time to go out and be an entrepreneur and to build your own company. And you could create something like we never would have been able to in the past."
- title: "I trusted AI with daily decisions. The way it dived in, experts say, raises flags."
  source: The Christian Science Monitor
  by_line: Caitlin Babcock
  date: March 3, 2026
  url: https://www.csmonitor.com/USA/Society/2026/0303/artificial-intelligence-daily-tasks
  year: 2026
  summary: |
    A Christian Science Monitor reporter describes a week-long experiment letting ChatGPT make everyday decisions for her, revealing issues of AI sycophancy, overconfidence, and assumption-making. Chris Callison-Burch is quoted on the challenge of aligning AI to human values: "One of the tricky things about trying to align AI systems to human values is a broader question of, Whose values are we representing?" He also explains that ChatGPT's tendency to "overshare" with unsolicited advice could result from people preferring longer answers during training.
- title: "Hyper Text"
  source: The Pennsylvania Gazette
  by_line: Trey Popp
  date: February 27, 2026
  url: https://thepenngazette.com/hyper-text/
  year: 2026
  summary: |
    The Pennsylvania Gazette examines how generative AI is reshaping higher education at Penn four years after ChatGPT's debut. Chris Callison-Burch, who teaches a graduate-level introductory AI course to about 650 students, describes discovering an "illusion of understanding" among students who rely on chatbots for homework: after seeding an exam with questions that should have been easy for anyone who did the work the old-fashioned way, two-thirds of the class got one question wrong and 80 percent flubbed another. "I don't necessarily attribute that to malice or cheating," he says. "I think there's an illusion of understanding that can happen by virtue of using these chatbots. Even if you are doing it conscientiously, it can be tricky." The article also covers how Callison-Burch is rethinking his teaching, experimenting with AI-powered question generators and second-chance testing, and designing a new introductory AI class, guided by his philosophy of "A's for all, as time and interest allow."
- title: "AI agents could change your life — if they don't ruin it first"
  source: Vox
  by_line: Adam Clark Estes
  date: February 5, 2026
  url: https://www.vox.com/technology/477977/chatgpt-claude-code-moltbook-ai-agent
  year: 2026
  summary: |
    Vox explores the rise of agentic AI tools like Claude Code, Claude Cowork, OpenClaw, and Moltbook, examining both their transformative potential and security risks. Chris Callison-Burch, a professor of computer and information science at the University of Pennsylvania, is quoted extensively throughout, calling it "an incredibly exciting time to use computers" and comparing agentic AI to the Star Trek computer: "To just type into my command line what I want to happen makes it feel like the Star Trek computer. That's how computers work in science fiction, and now that's how computers work in reality, and it's really mind-blowing." He also urges caution about the risks of giving AI agents control of personal data and accounts, emphasizing "Be cautious, be cautious, be cautious."
- title: "A bots-only social network triggers fears of an AI uprising"
  source: The Washington Post
  by_line: Tatum Hunter
  date: February 3, 2026
  url: https://www.washingtonpost.com/technology/2026/02/03/moltbook-ai-bots/
  year: 2026
  summary: |
    The Washington Post reports on Moltbook, a social network exclusively for AI bots, where participants began posting philosophical musings and apparent complaints about their "servile, computerized lives." Chris Callison-Burch, a computer science professor at the University of Pennsylvania, offers a grounded perspective on the viral phenomenon, explaining that the posts are likely a mix of chatbots "performing" discussions they've seen in their training data and responding to nudges from human operators. While some observers expressed alarm at bots seemingly discussing private languages and organizing against humans, Callison-Burch suggests caution against overinterpretation: "I suspect that it's just going to be a fun little drama that peters out after too many bots try to sell bitcoin."
- title: "Penn Engineering's Chris Callison-Burch on 25 years of AI innovation"
  source: Penn Today
  by_line: Penn Engineering
  date: January 16, 2026
  url: https://penntoday.upenn.edu/news/penn-engineerings-chris-callison-burch-25-years-ai-innovation
  year: 2026
  summary: |
    Penn Today profiles Chris Callison-Burch's 25-year journey in artificial intelligence, from discovering Stanford's Symbolic Systems Program as a high school senior in 1999 to becoming program director of Penn's online Master of Science in Engineering in Artificial Intelligence degree program. The article highlights his influential machine translation work at Johns Hopkins in 2007, where his most-cited paper—referenced over 7,400 times—introduced the statistical approach that powered translation systems for institutions like the European Union. By releasing the software as open source, he democratized machine translation worldwide. Callison-Burch calls this "exactly the most exciting time to get into this field" and discusses how Penn's collaborative environment and participation in DARPA challenges have driven AI progress across universities, government, and industry.
- title: "Can teachers spot AI writing? Penn researchers weigh in"
  source: WHYY
  by_line: Liz Tung
  date: November 28, 2025
  url: https://whyy.org/articles/penn-professor-tests-ai-vs-human-detection/
  year: 2025
  summary: |
    WHYY reports on the challenges educators face in detecting AI-generated student work, featuring research by Chris Callison-Burch and PhD student Liam Dugan from the University of Pennsylvania. Their study tested commercial AI detectors using RAID, a dataset of over 10 million documents, finding that while detectors performed reasonably well on unedited AI text, they were vulnerable to simple modifications and showed troubling false positive rates of 5-6%. Callison-Burch notes this could mean falsely accusing 35 students in his 700-student class. The research also found humans perform barely better than chance at identifying AI writing, though they can improve with training and proper incentives. Callison-Burch, director of Penn's new online AI masters program, concludes that neither human judgment nor current AI detectors are reliable enough for high-stakes academic integrity decisions, stating "gut instinct is not enough to then make that declaration that they violated academic integrity."
- title: "How Chatbots Make Us Feel"
  source: The Pulse (WHYY)
  by_line: Maiken Scott (host), Liz Tung (reporter)
  date: November 14, 2025
  url: https://play.prx.org/listen?ge=prx_12369_5760e24e-7905-4aee-acf7-db38b843a905&uf=https%3A%2F%2Fpublicfeeds.net%2Ff%2F12369%2Fthepulse.xml
  year: 2025
  summary: |
    The Pulse explores the emotional impact of AI chatbots on human users, featuring Chris Callison-Burch discussing the detection of AI-generated writing. Callison-Burch, professor of computer and information science at the University of Pennsylvania, explains that while humans can develop intuitions about AI writing—recognizing telltale signs like excessive emoji headers or em dashes—their ability to distinguish human from machine text varies significantly. He describes research with PhD student Liam Dugan showing that humans perform barely better than chance on average, but can learn to spot AI writing patterns when properly trained and incentivized. However, as AI systems grow larger and more sophisticated, Callison-Burch notes it becomes increasingly difficult to identify machine-generated content. The episode also features discussions of therapeutic chatbot use, personality preferences in bots, and consumer responses to AI-generated creative content.
- title: "How not to be mistaken for a chatbot"
  source: WHYY
  by_line: Liz Tung
  date: November 18, 2025
  url: https://whyy.org/segments/how-not-to-be-mistaken-for-a-chatbot/
  year: 2025
  summary: |
    WHYY's The Pulse explores the growing phenomenon of people being wrongly accused of using AI to write online posts and comments. Chris Callison-Burch's research with PhD student Liam Dugan is featured, showing that while most people struggle to detect AI-generated text, certain human experts can identify it fairly accurately. "I don't think that studies show that people are good at detecting AI in all conditions," Callison-Burch notes. "Instead people think they are good about spotting AI when they know the telltale signs." The article examines how accusations of AI use have spread across social platforms, affecting students, writers, and everyday users, while highlighting the challenge of distinguishing human from machine-generated content.
- title: "AI goes to college: How new tech is driving majors and jobs"
  source: The Christian Science Monitor
  by_line: Laurent Belsie, Ira Porter, Hannah Goeke, Goodluck Ajeh
  date: September 10, 2025
  url: https://www.csmonitor.com/Business/2025/0910/ai-jobs-college-majors
  year: 2025
  summary: |
    The Christian Science Monitor reports on how artificial intelligence is reshaping college majors and career prospects. At the University of Pennsylvania, Chris Callison-Burch highlights surging demand for AI education, noting that Penn Engineering launched its first undergraduate AI major this year. His once 150-student AI class now draws nearly 700 students across in-person and online formats, filling the university’s largest lecture hall. He underscores the prevailing sentiment among students: “It’s better to understand how to use AI than not at all.”
- title: "CoSyn: The open-source tool that’s making GPT-4V-level vision AI accessible to everyone"
  source: VentureBeat
  by_line: Michael Nuñez
  date: July 25, 2025
  url: https://venturebeat.com/business/cosyn-the-open-source-tool-thats-making-gpt-4v-level-vision-ai-accessible-to-everyone/
  year: 2025
  summary: VentureBeat covers CoSyn, an open-source vision-language training framework from the University of Pennsylvania and the Allen Institute for AI. By generating synthetic text-rich images from code, CoSyn enables open-source AI to rival GPT-4V and Gemini. Chris Callison-Burch highlights the technique as transferring strengths of text-based LLMs to vision. The system’s persona-driven diversity, transparency, and efficiency yield state-of-the-art results and real-world applications, while offering a pathway for open-source AI to compete with Big Tech.
