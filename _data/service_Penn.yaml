-
  description: Member of the Advisory Group for the Center for Excellence in Teaching, Learning and Innovation (CETLI).
  note: The CELTI advisory group provides advice, feedback and outreach to support CETLI's mission of promoting teaching excellence and innovation at Penn. Responsibilities include advising CETLI leadership on teaching and learning matters, raising concerns and aims from faculty perspectives, promoting CETLI resources and offerings within schools and departments, and working in partnership with CETLI's Executive Director and Senior Director for Digital Learning Strategies. Commitment involves one to two meetings per semester with possible additional sub-group meetings on specific projects. Terms are set for two or three years.
-
  description: Member of the Fellowships Faculty Review Committee for the Center for Undergraduate Research and Fellowships (CURF).
  note: This committee is responsible for reviewing, interviewing, and recommending applicants for university endorsement primarily for the Marshall Scholarship as well as preparing finalists for both Marshall and the Rhodes Scholarship from among Penn’s current undergraduate students and alumni.
